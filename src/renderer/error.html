<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Safe Exam Browser for Linux</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #1c1f26;
        color: #f6f7f9;
        text-align: center;
        padding: 32px;
      }
      .box {
        max-width: 560px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        opacity: 0.85;
      }
      code {
        background: rgba(255, 255, 255, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Configuration could not be loaded</h1>
      <p>
        Start the client with a configuration, for example:<br />
        <code>seb-linux exam.seb</code> or <code>seb-linux "seb://example.edu/exam.seb"</code>
      </p>
      <p>Run <code>seb-linux --help</code> for all options, and check the terminal output for details.</p>
    </div>
  </body>
</html>
