<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Configuration password</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        margin: 0;
        padding: 24px;
        background: #f6f7f9;
        color: #1c1f26;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1f26;
          color: #f6f7f9;
        }
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
        font-weight: 600;
      }
      p {
        font-size: 13px;
        margin: 0 0 16px;
        opacity: 0.8;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #9aa0aa;
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 16px;
      }
      button {
        padding: 7px 14px;
        font-size: 13px;
        border-radius: 6px;
        border: 1px solid #9aa0aa;
        cursor: pointer;
        background: transparent;
        color: inherit;
      }
      button.primary {
        background: #2f6fed;
        border-color: #2f6fed;
        color: #fff;
      }
      .error {
        color: #c0392b;
        font-size: 12px;
        min-height: 16px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Configuration password</h1>
    <p>
      This exam configuration is encrypted. Enter the password provided by your institution (for Classtime,
      the exam password shown at the start).
    </p>
    <input id="password" type="password" autofocus />
    <div class="error" id="error"></div>
    <div class="row">
      <button id="cancel">Cancel</button>
      <button id="submit" class="primary">Continue</button>
    </div>
    <script>
      const channel = new URLSearchParams(location.search).get('channel') || '';
      const input = document.getElementById('password');
      const error = document.getElementById('error');

      async function submit() {
        const ok = await window.sebLinux.submitConfigPassword(channel, input.value);
        if (!ok) {
          error.textContent = 'Incorrect password.';
          input.value = '';
          input.focus();
        }
      }

      document.getElementById('submit').addEventListener('click', submit);
      document.getElementById('cancel').addEventListener('click', () => window.close());
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submit();
      });
    </script>
  </body>
</html>
